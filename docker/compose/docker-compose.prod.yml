version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: synapsehr-postgres
    environment:
      POSTGRES_USER: synapsehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapsehr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapsehr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: synapsehr-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://synapsehr:${POSTGRES_PASSWORD}@postgres:5432/synapsehr
      - APP_ENV=production
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MODEL=${AI_MODEL:-gpt-4}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:4321","http://localhost"]}
      - VECTOR_DB_PATH=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
      - GENERATED_DOCS_DIR=/app/generated_documents
      - KNOWLEDGE_DIR=/app/knowledge
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
      - docs_data:/app/generated_documents
      - knowledge_data:/app/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: synapsehr-frontend
    environment:
      - PUBLIC_API_URL=http://backend:8000
    ports:
      - "4321:80"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: synapsehr-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  chroma_data:
  uploads_data:
  docs_data:
  knowledge_data:
